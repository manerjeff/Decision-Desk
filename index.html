<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Midterm Desk</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg:#0c0d10; --line:#2a2e37; --text:#e8eaed; --muted:#8b909a; --blue:#4c8dff; --red:#f07178; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--text); font-family:"Iowan Old Style",Palatino,serif; }
    header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:18px 22px 10px; }
    .brand { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-family:-apple-system,sans-serif; }
    h1 { font-size:clamp(28px,4vw,42px); font-weight:600; letter-spacing:-.02em; line-height:1; margin-top:4px; }
    .meta { text-align:right; font-family:-apple-system,sans-serif; font-size:12px; color:var(--muted); line-height:1.45; }
    .meta strong { color:var(--text); }
    .modes { display:flex; gap:8px; padding:0 22px 14px; border-bottom:1px solid var(--line); font-family:-apple-system,sans-serif; }
    .modes button { background:transparent; color:var(--muted); border:0; border-bottom:2px solid transparent; padding:8px 4px; font-size:13px; cursor:pointer; }
    .modes button.on { color:var(--text); border-bottom-color:var(--text); }
    .board { padding:18px 22px 8px; display:grid; grid-template-columns:1.2fr .8fr; gap:20px; }
    .split { display:flex; align-items:flex-end; gap:18px; }
    .n { font-size:clamp(42px,7vw,72px); font-weight:600; letter-spacing:-.04em; line-height:.9; }
    .n.d { color:var(--blue); } .n.r { color:var(--red); }
    .n span { display:block; font-family:-apple-system,sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .path { font-family:-apple-system,sans-serif; font-size:14px; color:var(--muted); max-width:42ch; line-height:1.45; }
    .path b { color:var(--text); }
    .chamber { height:10px; border-radius:99px; overflow:hidden; display:flex; margin-top:14px; background:var(--line); }
    .buckets { display:flex; flex-wrap:wrap; gap:8px; }
    .pill { font-family:-apple-system,sans-serif; font-size:11px; padding:6px 9px; border:1px solid var(--line); border-radius:999px; color:var(--muted); }
    .pill b { color:var(--text); }
    .stage { display:grid; grid-template-columns:minmax(320px,1fr) minmax(280px,.95fr); gap:0; border-top:1px solid var(--line); min-height:62vh; }
    .list-col { border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
    .filters { display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px; border-bottom:1px solid var(--line); font-family:-apple-system,sans-serif; }
    .filters button { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 10px; font-size:11px; cursor:pointer; }
    .filters button.on { color:var(--text); border-color:var(--text); }
    table { width:100%; border-collapse:collapse; font-family:-apple-system,sans-serif; font-size:13px; }
    thead th { text-align:left; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
    tbody tr { cursor:pointer; border-bottom:1px solid #1c1f26; }
    tbody tr:hover, tbody tr.sel { background:#1a1d24; }
    td { padding:9px 10px; vertical-align:top; }
    .st { font-weight:650; } .sub { color:var(--muted); font-size:11px; margin-top:2px; } .rate { font-weight:650; }
    .list-wrap { overflow:auto; flex:1; max-height:calc(100dvh - 320px); }
    #map { min-height:420px; background:#0a0b0e; }
    .leaflet-container { background:#0a0b0e !important; }
    .detail { padding:14px 16px; border-top:1px solid var(--line); font-family:-apple-system,sans-serif; }
    .detail h2 { font-family:"Iowan Old Style",Palatino,serif; font-size:22px; }
    .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .src { font-size:11px; border:1px solid var(--line); padding:4px 7px; border-radius:4px; color:var(--muted); }
    footer { padding:14px 22px 22px; color:var(--muted); font-size:11px; font-family:-apple-system,sans-serif; border-top:1px solid var(--line); }
    @media (max-width:900px) { header,.board { display:block; } .stage { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">Independent midterm briefing</div>
      <h1 id="page-title">2026 Midterm Desk</h1>
    </div>
    <div class="meta">
      <div id="updated"><strong>Loading snapshot…</strong></div>
      <div>Not affiliated with Decision Desk HQ</div>
    </div>
  </header>
  <div class="modes" id="modes"></div>
  <section class="board">
    <div>
      <div class="split">
        <div class="n d"><span id="lab-d">Democrats</span><span id="num-d">47</span></div>
        <div class="n r"><span id="lab-r">Republicans</span><span id="num-r">53</span></div>
      </div>
      <p class="path" id="path"></p>
      <div class="chamber" id="bar"><i id="bar-d" style="background:var(--blue);flex:47"></i><i id="bar-r" style="background:var(--red);flex:53"></i></div>
    </div>
    <div class="buckets" id="buckets"></div>
  </section>
  <section class="stage">
    <div class="list-col">
      <div class="filters" id="filters"></div>
      <div class="list-wrap">
        <table>
          <thead><tr><th>State</th><th>Seat</th><th>Consensus</th><th>Matchup</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="detail" id="detail"><div class="sub">Select a race</div></div>
    </div>
    <div id="map"></div>
  </section>
  <footer>Senate and governor ratings from Wikipedia (CC BY-SA). House is the generic ballot, not a district map. Not a forecast model.</footer>
  <script>
    const MODES=[["senate","Senate"],["gov","Governors"],["house","House"]];
    const FILTERS=[["all","All"],["toss","Toss-up"],["lean","Lean / tilt"],["flip","Hold at risk"],["d","Democratic seats"],["r","Republican seats"]];
    let data=null, mode="senate", filter="all", map, geo, selected=null;
    function list(){ if(mode==="senate") return data.races||[]; if(mode==="gov") return (data.governors&&data.governors.races)||[]; return []; }
    const passes=r=> filter==="all"|| (filter==="toss"&&r.score===0)|| (filter==="lean"&&Math.abs(r.score)===1)|| (filter==="flip"&&((r.held==="R"&&r.score<=0)||(r.held==="D"&&r.score>=0)))|| (filter==="d"&&r.held==="D")|| (filter==="r"&&r.held==="R");
    function colorFor(name){ const r=list().find(x=>x.state===name); return r?r.color:"#22252c"; }
    function initMap(){
      map=L.map("map",{center:[39.5,-96.4],zoom:4,minZoom:3,maxZoom:7,zoomControl:false});
      L.control.zoom({position:"topright"}).addTo(map);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{attribution:"Tiles © Esri",maxZoom:16}).addTo(map);
      fetch("https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json").then(r=>r.json()).then(states=>{
        geo=L.geoJson(states,{style:f=>({fillColor:colorFor(f.properties.name),weight:1,color:"#2a2e37",fillOpacity:.78}),onEachFeature:(f,layer)=>{layer.on("click",()=>{const r=list().find(x=>x.state===f.properties.name); if(r) select(r);});}}).addTo(map);
      });
    }
    function paintMap(){ if(!geo) return; const rows=list(); geo.setStyle(f=>({fillColor:colorFor(f.properties.name),weight:1,color:"#2a2e37",fillOpacity:rows.some(r=>r.state===f.properties.name&&passes(r))?0.82:0.16})); }
    function renderModes(){ document.getElementById("modes").innerHTML=MODES.map(([id,l])=>`<button class="${id===mode?"on":""}" data-id="${id}">${l}</button>`).join(""); document.getElementById("modes").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; mode=b.dataset.id; filter="all"; selected=null; renderModes(); renderBoard(); renderFilters(); renderRows(); paintMap(); if(map) map.flyTo([39.5,-96.4],4); }; }
    function renderFilters(){ if(mode==="house"){ document.getElementById("filters").innerHTML=""; return; } document.getElementById("filters").innerHTML=FILTERS.map(([id,l])=>`<button class="${id===filter?"on":""}" data-id="${id}">${l}</button>`).join(""); document.getElementById("filters").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; filter=b.dataset.id; renderFilters(); renderRows(); paintMap(); }; }
    function renderRows(){
      if(mode==="house"){ const w=(data.house&&data.house.watch)||[]; document.getElementById("rows").innerHTML=w.map(x=>`<tr><td colspan="4"><div class="st">${x.label}</div><div class="sub">${x.detail}</div></td></tr>`).join(""); return; }
      const rows=list().filter(passes);
      document.getElementById("rows").innerHTML=rows.map(r=>`<tr data-abbr="${r.abbr}" class="${selected&&selected.abbr===r.abbr?"sel":""}"><td><div class="st">${r.state}</div><div class="sub">${r.abbr}${r.special?" · special":""}${r.open?" · open":""}</div></td><td>${r.held==="D"?"Dem hold":"GOP hold"}</td><td class="rate" style="color:${r.color}">${r.consensus}</td><td>${r.dem} <span class="sub">vs</span> ${r.gop}</td></tr>`).join("");
      document.getElementById("rows").onclick=e=>{ const tr=e.target.closest("tr"); if(!tr||!tr.dataset.abbr) return; const r=list().find(x=>x.abbr===tr.dataset.abbr); if(r) select(r); };
    }
    function select(r){
      selected=r; renderRows();
      document.getElementById("detail").innerHTML=`<h2>${r.state}</h2><div class="sub" style="margin:4px 0 8px">${mode==="gov"?"Governor · ":""}${r.special?"Special · ":""}${r.open?"Open seat · ":""}${r.incumbent}</div><div class="rate" style="color:${r.color};font-size:18px">${r.consensus}</div><p style="margin-top:8px">${r.matchup}</p><div class="sources"><span class="src">Cook ${r.cook}</span><span class="src">IE ${r.ie}</span><span class="src">Sabato ${r.sabato}</span><span class="src">Silver ${r.silver}</span></div>`;
      if(map && r.lat && r.lng && r.abbr!=="AK" && r.abbr!=="HI") map.flyTo([r.lat,r.lng],5.2);
    }
    function renderBoard(){
      const order=["Solid D","Likely D","Lean D","Toss-up","Lean R","Likely R","Solid R"];
      document.getElementById("updated").innerHTML=`<strong>${data.updatedLabel||""}</strong><div>${data.source||""}</div>`;
      if(mode==="senate"){ const s=data.senate; document.getElementById("page-title").textContent="2026 Senate Desk"; document.getElementById("lab-d").textContent="Democrats"; document.getElementById("lab-r").textContent="Republicans"; document.getElementById("num-d").textContent=s.currentDem; document.getElementById("num-r").textContent=s.currentGop; document.getElementById("path").innerHTML=`<b>Net +${s.neededForDemMajority}</b> for a Democratic majority. ${s.tossUpCount} toss-ups among ${s.seatsUp} Senate seats.`; document.getElementById("bar-d").style.flex=s.currentDem; document.getElementById("bar-r").style.flex=s.currentGop; document.getElementById("buckets").innerHTML=order.filter(k=>s.buckets[k]).map(k=>`<div class="pill"><b>${s.buckets[k]}</b> ${k}</div>`).join(""); }
      else if(mode==="gov"){ const g=data.governors; document.getElementById("page-title").textContent="2026 Governors Desk"; document.getElementById("lab-d").textContent="Dem governors"; document.getElementById("lab-r").textContent="GOP governors"; document.getElementById("num-d").textContent=g.currentDem; document.getElementById("num-r").textContent=g.currentGop; document.getElementById("path").innerHTML=`<b>${g.seatsUp} chairs</b> on the 2026 ballot (${g.demSeatsUp} D / ${g.gopSeatsUp} R). ${g.tossUpCount} toss-ups.`; document.getElementById("bar-d").style.flex=g.currentDem; document.getElementById("bar-r").style.flex=g.currentGop; document.getElementById("buckets").innerHTML=order.filter(k=>g.buckets[k]).map(k=>`<div class="pill"><b>${g.buckets[k]}</b> ${k}</div>`).join(""); }
      else { const h=data.house; document.getElementById("page-title").textContent="2026 House Desk"; document.getElementById("lab-d").textContent="Generic D"; document.getElementById("lab-r").textContent="Generic R"; document.getElementById("num-d").textContent=h.genericDem; document.getElementById("num-r").textContent=h.genericGop; document.getElementById("path").innerHTML=`<b>${h.needed} seats</b> to organize the House. ${h.genericNote}`; document.getElementById("bar-d").style.flex=h.genericDem; document.getElementById("bar-r").style.flex=h.genericGop; document.getElementById("buckets").innerHTML=`<div class="pill"><b>${h.currentDem}</b> Dem seats now</div><div class="pill"><b>${h.currentGop}</b> GOP seats now</div><div class="pill">No district map</div>`; document.getElementById("detail").innerHTML=`<div class="sub">${h.note}</div>`; }
    }
    async function load(){
      const stamp=Date.now();
      const grab=url=>fetch(url+"?v="+stamp).then(r=>r.ok?r.json():null).catch(()=>null);
      const [sen,gov,house,snap]=await Promise.all([grab("./senate.json"),grab("./governors.json"),grab("./house.json"),grab("./snapshot.json")]);
      data=sen||snap||{};
      if(gov) data.governors=gov; else if(snap&&snap.governors) data.governors=snap.governors;
      if(house) data.house=house; else if(snap&&snap.house) data.house=snap.house;
      if(!data.updatedLabel && snap) data.updatedLabel=snap.updatedLabel;
      if(!data.source && snap) data.source=snap.source;
      renderModes(); renderBoard(); renderFilters(); renderRows(); paintMap();
    }
    window.addEventListener("load",()=>{ initMap(); load(); });
  </script>
</body>
</html>
