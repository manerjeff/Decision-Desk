name: Auto-Update Polling Data

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs automatically every 4 hours
  workflow_dispatch:        # Allows manual triggering from GitHub UI

# GRANT WRITE PERMISSIONS TO COMMIT FILES
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Data Scraper
        run: python fetch_polls.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add polls.json
          git commit -m "Auto-update live polling JSON" || exit 0
          git push
