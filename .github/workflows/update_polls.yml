name: Rebuild midterm snapshot

on:
  schedule:
    - cron: '20 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Pull Wikipedia ratings and rebuild snapshot files
        run: python fetch_snapshot.py
      - name: Commit snapshot files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json senate.json governors.json house.json
          git commit -m "Nightly midterm ratings snapshot" || exit 0
          git push
